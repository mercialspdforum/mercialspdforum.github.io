<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD — Detective Bureau &amp; GND Forum</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
    <style>
        :root, [data-theme="dark"] {
            --bg: #06080f; --card: #0e1420; --border: rgba(255,255,255,0.08);
            --blue: #3b82f6; --purple: #a78bfa; --orange: #f97316; --green: #10b981;
            --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8; --dim: #64748b;
            --radius: 12px; --input-bg: rgba(0,0,0,0.35);
        }
        [data-theme="light"] {
            --bg: #f0f4f8; --card: #fff; --border: rgba(15,23,42,0.1);
            --text: #0f172a; --muted: #475569; --dim: #94a3b8; --input-bg: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; line-height: 1.5; transition: background .25s, color .25s;
        }
        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .auth-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(167,139,250,0.15), transparent);
        }
        .auth-card {
            width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 32px; text-align: center;
        }
        .auth-card h1 { font-size: 1.25rem; margin: 12px 0 4px; }
        .auth-card .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label {
            display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted);
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .form-control {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text); font-family: inherit; font-size: 0.95rem;
        }
        .form-control:focus { outline: none; border-color: var(--purple); }
        textarea.form-control { min-height: 100px; resize: vertical; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 14px; border-radius: 8px; border: none; font-weight: 600; font-family: inherit;
            cursor: pointer; font-size: 0.85rem; transition: 0.15s;
        }
        .btn-primary { background: var(--purple); color: #fff; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-ghost:hover { border-color: var(--purple); color: var(--text); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-success { background: var(--green); color: #fff; }
        .btn-warn { background: #f59e0b; color: #111; }
        .err { color: var(--red); font-size: 0.85rem; margin-top: 10px; display: none; }

        #app { display: none; min-height: 100vh; flex-direction: column; }
        #app.show { display: flex; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card);
            position: sticky; top: 0; z-index: 50; flex-wrap: wrap;
        }
        .topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; cursor: pointer; }
        .topbar .brand span { color: var(--purple); }
        .topbar .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
        .badge {
            display: inline-flex; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
            background: rgba(167,139,250,0.15); color: var(--purple); border: 1px solid rgba(167,139,250,0.3);
        }
        .badge.gnd { background: rgba(249,115,22,0.15); color: var(--orange); border-color: rgba(249,115,22,0.35); }
        .badge.tag { background: rgba(59,130,246,0.12); color: var(--blue); border-color: rgba(59,130,246,0.3); margin: 2px; }
        .badge.locked { background: rgba(239,68,68,0.12); color: var(--red); }
        .badge.pinned { background: rgba(245,158,11,0.15); color: #f59e0b; }

        .main { max-width: 960px; width: 100%; margin: 0 auto; padding: 20px 14px 48px; flex: 1; }
        .breadcrumb { font-size: 0.8rem; color: var(--dim); margin-bottom: 14px; }
        .breadcrumb a { color: var(--muted); }
        .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .page-head h2 { font-size: 1.25rem; }
        .page-head p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

        .search-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-row input { flex: 1; min-width: 160px; }

        .cat-card, .topic-row, .post-card, .panel {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px;
        }
        .cat-card {
            padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
        }
        .cat-card:hover { border-color: rgba(167,139,250,0.4); }
        .cat-card .ico {
            width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            background: rgba(167,139,250,0.12); color: var(--purple); flex-shrink: 0;
        }
        .cat-card.gnd .ico { background: rgba(249,115,22,0.12); color: var(--orange); }
        .cat-card h3 { font-size: 1rem; margin-bottom: 2px; }
        .cat-card p { font-size: 0.8rem; color: var(--muted); }
        .cat-meta { margin-left: auto; text-align: right; font-size: 0.75rem; color: var(--dim); }

        .topic-row {
            padding: 12px 14px; cursor: pointer; display: grid;
            grid-template-columns: 1fr auto; gap: 10px; align-items: center;
        }
        .topic-row:hover { border-color: rgba(59,130,246,0.4); }
        .topic-row h4 { font-size: 0.92rem; font-weight: 600; }
        .topic-row .meta { font-size: 0.72rem; color: var(--dim); margin-top: 4px; }
        .topic-stats { text-align: right; font-size: 0.72rem; color: var(--muted); }

        .post-card { overflow: hidden; }
        .post-head {
            display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 8px 14px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);
            font-size: 0.78rem; color: var(--muted);
        }
        .post-body { padding: 14px; font-size: 0.92rem; line-height: 1.65; word-break: break-word; }
        .post-body img, .bb-img { max-width: 100%; border-radius: 8px; margin: 8px 0; cursor: pointer; display: block; }
        .post-body blockquote, .preview-box blockquote {
            border-left: 3px solid var(--purple); padding: 8px 12px; margin: 10px 0;
            background: rgba(167,139,250,0.08); color: var(--muted); border-radius: 0 8px 8px 0;
        }
        .post-body blockquote cite {
            display: block; font-weight: 700; font-style: normal; color: var(--purple); margin-bottom: 6px; font-size: 0.85em;
        }
        .bb-pre {
            background: rgba(0,0,0,0.45); padding: 12px; border-radius: 8px; overflow-x: auto;
            font-family: ui-monospace, monospace; font-size: 0.85em; margin: 8px 0; white-space: pre-wrap;
        }
        .bb-spoiler summary { cursor: pointer; color: var(--purple); font-weight: 600; margin-bottom: 6px; }
        .bb-hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
        .post-body ul, .post-body ol { margin: 8px 0 8px 22px; }
        .post-body a { color: var(--blue); text-decoration: underline; }
        .post-actions { padding: 0 14px 12px; display: flex; gap: 6px; flex-wrap: wrap; }

        .bb-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .bb-toolbar button {
            background: rgba(128,128,128,0.08); border: 1px solid var(--border); color: var(--muted);
            padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.72rem; font-family: inherit;
        }
        .bb-toolbar button:hover { color: var(--text); border-color: var(--purple); }
        .preview-box {
            border: 1px dashed var(--border); border-radius: 8px; padding: 12px; margin-top: 8px;
            font-size: 0.9rem; min-height: 40px; background: rgba(0,0,0,0.15);
        }

        .compose { padding: 14px; margin-top: 16px; }
        .compose h3 { font-size: 0.9rem; margin-bottom: 10px; }
        .empty { text-align: center; padding: 36px 16px; color: var(--dim); }
        .empty i { font-size: 1.8rem; margin-bottom: 8px; opacity: 0.5; display: block; }

        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
            display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-bg.show { display: flex; }
        .modal {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            width: 100%; max-width: 540px; padding: 20px; max-height: 90vh; overflow-y: auto;
        }
        .modal h3 { margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; flex-wrap: wrap; }

        .toast {
            position: fixed; bottom: 16px; right: 16px; background: var(--card); border: 1px solid var(--border);
            padding: 12px 14px; border-radius: 10px; z-index: 200; display: none; max-width: 280px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        .toast.show { display: block; }

        .denied {
            max-width: 420px; margin: 80px auto; text-align: center; padding: 32px;
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
        }
        .denied i { font-size: 2.2rem; color: var(--red); margin-bottom: 10px; }

        .notif-wrap { position: relative; }
        .notif-btn {
            background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer; position: relative;
        }
        .notif-btn .dot {
            position: absolute; top: -3px; right: -3px; background: var(--red); color: #fff;
            font-size: 0.6rem; min-width: 16px; height: 16px; border-radius: 8px;
            display: none; align-items: center; justify-content: center; font-weight: 700;
        }
        .notif-panel {
            display: none; position: absolute; right: 0; top: 42px; width: 300px; max-height: 360px;
            overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4); z-index: 80;
        }
        .notif-panel.show { display: block; }
        .notif-item { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.8rem; cursor: pointer; }
        .notif-item:hover { background: rgba(167,139,250,0.08); }
        .notif-item.unread { border-left: 3px solid var(--purple); }

        .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .tabs button {
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
            color: var(--muted); cursor: pointer; font-size: 0.8rem; font-family: inherit;
        }
        .tabs button.active { background: rgba(167,139,250,0.15); color: var(--purple); border-color: rgba(167,139,250,0.35); }

        .activity-item {
            padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.82rem;
        }
        .activity-item:last-child { border-bottom: none; }
        .pag { display: flex; gap: 6px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
        .pag button {
            min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: transparent; color: var(--muted); cursor: pointer;
        }
        .pag button.active { background: var(--purple); color: #fff; border-color: var(--purple); }

        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 12px; text-align: center;
            cursor: pointer; margin: 8px 0; font-size: 0.8rem; color: var(--muted);
        }
        .upload-zone:hover { border-color: var(--purple); }
        .upload-zone input { display: none; }

        .member-row {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
            border-bottom: 1px solid var(--border); font-size: 0.85rem;
        }
        .log-row { padding: 8px 12px; font-size: 0.78rem; border-bottom: 1px solid var(--border); color: var(--muted); }
    </style>
</head>
<body>

<div class="auth-wrap" id="authScreen">
    <div class="auth-card">
        <i class="fa-solid fa-user-secret" style="font-size:2rem;color:var(--purple);"></i>
        <h1>Detective Bureau &amp; GND</h1>
        <p class="sub">Sadece Detective I / II / Supervisor ve GND</p>
        <div class="form-group">
            <label>IC İsim (Ad Soyad)</label>
            <input type="text" id="loginName" class="form-control" placeholder="John Doe" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Şifre</label>

</div>

<div id="app">
    <header class="topbar">
        <div class="brand" onclick="goHome()">
            <i class="fa-solid fa-user-secret" style="color:var(--purple);"></i>
            <div>LSPD <span>Forum</span></div>
        </div>
        <div class="right">
            <div class="notif-wrap">
                <button class="notif-btn" onclick="toggleNotif(event)" title="Bildirimler">

                    <div style="padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
                        <strong style="font-size:0.85rem;">Bildirimler</strong>
                        <button class="btn btn-ghost btn-sm" onclick="markAllNotifs()">Okundu</button>

                </div>

            <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
            <button class="btn btn-ghost btn-sm" onclick="goMembers()"><i class="fa-solid fa-users"></i></button>
            <button class="btn btn-ghost btn-sm" id="adminBtn" style="display:none;" onclick="goAdmin()"><i class="fa-solid fa-gear"></i></button>
            <span id="topName">-</span>
            <span class="badge" id="topRank">-</span>
            <button class="btn btn-ghost btn-sm" onclick="logout()">Çıkış</button>
        </div>
    </header>
    <div class="main" id="mainView"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDdp_kKYK0wGDUGUgkO96-vGZs5F2Ot250",
    authDomain: "mercia-pd.firebaseapp.com",
    databaseURL: "https://mercia-pd-default-rtdb.firebaseio.com",
    projectId: "mercia-pd",
    storageBucket: "mercia-pd.firebasestorage.app",
    messagingSenderId: "340875265258",
    appId: "1:340875265258:web:8ebbff9c4275888ee9c393",
    measurementId: "G-WLT3SZ2GFY"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const ALLOWED_RANKS = ["Detective I", "Detective II", "Detective Supervisor", "GND", "Gang & Narcotics Division"];
const DEFAULT_CATEGORIES = [
    { id: "fraksiyon", title: "Fraksiyon Raporları", desc: "Her yapılanma için konu; yanıtlar alt alta.", icon: "fa-people-group", gnd: false },
    { id: "sahis", title: "Şahıs Takip", desc: "Her şahıs bir konu.", icon: "fa-user-tag", gnd: false },
    { id: "cinayet", title: "Cinayet / Ağır Suç", desc: "Ağır dosyalar.", icon: "fa-skull", gnd: false },
    { id: "fid", title: "FID / Kimlik", desc: "FID notları.", icon: "fa-id-card", gnd: false },
    { id: "gnd", title: "GND — Gang & Narcotics", desc: "GND operasyonları ve çete dosyaları.", icon: "fa-user-ninja", gnd: true },
    { id: "genel", title: "Genel / Koordinasyon", desc: "Büro duyuruları.", icon: "fa-comments", gnd: false }
];
const TAGS = ["aktif", "kapalı", "acil", "gizli", "bekliyor"];
const POST_PAGE = 15;

let currentUser = null, currentUserId = null, view = { page: "home" }, unsub = null;
let allNotifs = [], postPage = 1, allPostsCache = [];

function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function safeUrl(u) {
    u = String(u || "").trim().replace(/&amp;/g, "&").replace(/&quot;/g, '"');
    if (!/^https?:\/\//i.test(u)) return "";
    // javascript: engelle
    if (/javascript:/i.test(u)) return "";
    return u.replace(/"/g, "");
}
function bbcode(raw) {
    if (raw == null) return "";
    let text = String(raw);
    const slots = [];
    const park = (html) => {
        const i = slots.length;
        slots.push(html);
        return "\u0000BB" + i + "\u0000";
    };

    // 1) [code] — içi parse edilmez
    text = text.replace(/\[code\]([\s\S]*?)\[\/code\]/gi, (_, c) =>
        park("<pre class=\"bb-pre\"><code>" + esc(c.replace(/^\n|\n$/g, "")) + "</code></pre>")
    );

    // 2) [img] — URL ham
    text = text.replace(/\[img\]\s*(https?:\/\/[^\s\[\]]+?)\s*\[\/img\]/gi, (_, u) => {
        const url = safeUrl(u);
        return url ? park('<img src="' + url + '" alt="" class="bb-img" onclick="window.open(this.src,\'_blank\')">') : "";
    });

    // 3) [url=...]...[/url] ve [url]...[/url]
    text = text.replace(/\[url\s*=\s*([^\]]+)\]([\s\S]*?)\[\/url\]/gi, (_, u, label) => {
        const url = safeUrl(u.replace(/^["']|["']$/g, ""));
        if (!url) return esc(label);
        return park('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + esc(label) + "</a>");
    });
    text = text.replace(/\[url\]\s*(https?:\/\/[^\s\[\]]+?)\s*\[\/url\]/gi, (_, u) => {
        const url = safeUrl(u);
        return url ? park('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + esc(url) + "</a>") : "";
    });

    // 4) Kalan metni escape
    text = esc(text);

    // 5) Çift geçiş: iç içe [b][i] için
    const applyInline = (s) => {
        s = s.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, "<strong>$1</strong>");
        s = s.replace(/\[i\]([\s\S]*?)\[\/i\]/gi, "<em>$1</em>");
        s = s.replace(/\[u\]([\s\S]*?)\[\/u\]/gi, "<u>$1</u>");
        s = s.replace(/\[s\]([\s\S]*?)\[\/s\]/gi, "<s>$1</s>");
        s = s.replace(/\[color\s*=\s*([a-zA-Z#0-9]+)\]([\s\S]*?)\[\/color\]/gi,
            '<span style="color:$1">$2</span>');
        s = s.replace(/\[size\s*=\s*(\d+)\]([\s\S]*?)\[\/size\]/gi,
            '<span style="font-size:$1px">$2</span>');
        s = s.replace(/\[center\]([\s\S]*?)\[\/center\]/gi, '<div style="text-align:center">$1</div>');
        s = s.replace(/\[left\]([\s\S]*?)\[\/left\]/gi, '<div style="text-align:left">$1</div>');
        s = s.replace(/\[right\]([\s\S]*?)\[\/right\]/gi, '<div style="text-align:right">$1</div>');
        s = s.replace(/\[spoiler\]([\s\S]*?)\[\/spoiler\]/gi,
            '<details class="bb-spoiler"><summary>Spoiler</summary><div>$1</div></details>');
        s = s.replace(/\[quote\]([\s\S]*?)\[\/quote\]/gi, "<blockquote>$1</blockquote>");
        s = s.replace(/\[quote\s*=\s*([^\]]+)\]([\s\S]*?)\[\/quote\]/gi,
            "<blockquote><cite>$1</cite>$2</blockquote>");
        s = s.replace(/\[list\]([\s\S]*?)\[\/list\]/gi, (_, inner) => {
            const items = inner.split(/\[\*\]/).map(x => x.trim()).filter(Boolean);
            return "<ul>" + items.map(i => "<li>" + i + "</li>").join("") + "</ul>";
        });
        s = s.replace(/\[list=1\]([\s\S]*?)\[\/list\]/gi, (_, inner) => {
            const items = inner.split(/\[\*\]/).map(x => x.trim()).filter(Boolean);
            return "<ol>" + items.map(i => "<li>" + i + "</li>").join("") + "</ol>";
        });
        s = s.replace(/\[hr\]/gi, "<hr class=\"bb-hr\">");
        return s;
    };
    text = applyInline(text);
    text = applyInline(text); // iç içe etiket 2. tur

    // 6) Satır sonları (park yerlerini bozmamak için)
    text = text.replace(/\r\n/g, "\n").replace(/\n/g, "<br>");

    // 7) Park edilen HTML geri
    text = text.replace(/\u0000BB(\d+)\u0000/g, (_, n) => slots[Number(n)] || "");

    return text;
}
function formatDate(ts) {
    if (!ts) return "-";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return isNaN(d) ? "-" : d.toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" });
}
function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2500);
}
function isAllowedRank(rank) {
    if (!rank) return false;
    const r = rank.trim();
    if (ALLOWED_RANKS.includes(r)) return true;
    if (/^detective\s*(i|ii|1|2|supervisor)/i.test(r)) return true;
    if (/gnd|gang/i.test(r)) return true;
    return false;
}
function isSupervisor() {
    const r = currentUser?.rank || "";
    return /supervisor|lieutenant/i.test(r) || currentUser?.isAdmin;
}
function isGndMember() {
    const r = (currentUser?.rank || "") + " " + (currentUser?.unit || "");
    return /gnd|gang\s*&?\s*narcotics|supervisor/i.test(r);
}
function nameToEmail(name) {
    return name.trim().toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "") + "@lspd.local";

        return;

/* —— BB TOOLBAR —— */
function mountBb(toolbarId, taId) {
    const bar = document.getElementById(toolbarId);
    if (!bar) return;
    const tags = [
        ["B","[b]","[/b]"],["I","[i]","[/i]"],["U","[u]","[/u]"],["S","[s]","[/s]"],
        ["Quote","[quote]","[/quote]"],["URL","[url]","[/url]"],
        ["Img","[img]","[/img]"],["Code","[code]","[/code]"],["Spoiler","[spoiler]","[/spoiler]"],
        ["List","[list]\n[*]\n[/list]",""],["HR","[hr]",""]
    ];
    bar.innerHTML = tags.map(([l,o,c]) =>
        `<button type="button" data-ta="${taId}" data-o="${esc(o)}" data-c="${esc(c)}" onclick="insertBb(this.dataset.ta,this.dataset.o,this.dataset.c)">${l}</button>`
    ).join("") + `<button type="button" onclick="togglePreview('${taId}')">Önizle</button>`;
}
function insertBb(id, open, close) {
    const ta = document.getElementById(id);
    if (!ta) return;
    // dataset HTML entity decode
    const dec = (s) => { const d = document.createElement("textarea"); d.innerHTML = s; return d.value; };
    open = dec(open); close = dec(close || "");
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.substring(s, e) || (close ? "metin" : "");
    const ins = close ? open + sel + close : open;
    ta.value = ta.value.substring(0, s) + ins + ta.value.substring(e);
    ta.focus();
    if (close) {
        ta.selectionStart = s + open.length;
        ta.selectionEnd = s + open.length + sel.length;
    }
}
function togglePreview(taId) {
    let prev = document.getElementById(taId + "_prev");
    if (prev) { prev.remove(); return; }
    const ta = document.getElementById(taId);
    prev = document.createElement("div");
    prev.id = taId + "_prev";
    prev.className = "preview-box";
    prev.innerHTML = bbcode(ta.value) || "<span style='color:var(--dim)'>Boş</span>";
    ta.parentNode.insertBefore(prev, ta.nextSibling);
}

        view.topicCache.sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;

        });

function filterTopics() {
    const q = (document.getElementById("catSearch")?.value || "").toLowerCase();

    if (!box) return;
    let list = view.topicCache || [];
    if (q) list = list.filter(t => ((t.title || "") + (t.tags || []).join(" ")).toLowerCase().includes(q));
    if (!list.length) { box.innerHTML = '<div class="empty"><i class="fa-solid fa-folder-open"></i><p>Konu yok</p></div>'; return; }

            <div class="topic-stats"><div>${t.replyCount || 0} yanıt</div><div style="color:var(--dim)">${formatDate(t.lastPostAt)}</div></div>

async function uploadToField(input, taId) {
    if (!input.files?.[0]) return;
    const file = input.files[0];
    toast("Yükleniyor…");
    try {
        const path = "forum/" + currentUserId + "/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");
        await storage.ref().child(path).put(file);
        const url = await storage.ref().child(path).getDownloadURL();
        const ta = document.getElementById(taId);
        ta.value += (ta.value ? "\n" : "") + "[img]" + url + "[/img]";
        // Anında önizleme göster
        showImgStrip(taId, url);
        // Canlı önizleme kutusunu güncelle
        let prev = document.getElementById(taId + "_prev");
        if (!prev) {
            prev = document.createElement("div");
            prev.id = taId + "_prev";
            prev.className = "preview-box";
            ta.parentNode.insertBefore(prev, ta.nextSibling);
        }
        prev.innerHTML = bbcode(ta.value);
        toast("Foto eklendi — önizlemede görünüyor");
    } catch (e) {
        alert("Yükleme hatası: " + e.message + "\n(Storage kurallarını aç)");
    }
    input.value = "";
}
function showImgStrip(taId, url) {
    let strip = document.getElementById(taId + "_imgs");
    const ta = document.getElementById(taId);
    if (!ta) return;
    if (!strip) {
        strip = document.createElement("div");
        strip.id = taId + "_imgs";
        strip.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;";
        ta.parentNode.insertBefore(strip, ta.nextSibling);
    }
    const img = document.createElement("img");
    img.src = url;
    img.className = "bb-img";
    img.style.cssText = "max-width:140px;max-height:100px;object-fit:cover;border-radius:8px;cursor:pointer;";
    img.onclick = () => window.open(url, "_blank");
    strip.appendChild(img);
}

async function createTopic() {
    const title = document.getElementById("newTopicTitle").value.trim();

    const tags = Array.from(document.querySelectorAll(".topic-tag:checked")).map(c => c.value);
    if (!title || !body) return alert("Başlık ve mesaj zorunlu.");
    const now = firebase.firestore.FieldValue.serverTimestamp();
    try {
        const topicRef = await db.collection("forumTopics").add({
            categoryId: view.catId, title, tags, locked: false, pinned: false,
            authorId: currentUserId, authorName: currentUser.name + " (" + currentUser.rank + ")",
            createdAt: now, lastPostAt: now, replyCount: 0
        });
        await db.collection("forumPosts").add({
            topicId: topicRef.id, authorId: currentUserId,
            authorName: currentUser.name + " (" + currentUser.rank + ")",
            body, createdAt: now, isOp: true
        });
        await db.collection("forumCategories").doc(view.catId).update({
            topicCount: firebase.firestore.FieldValue.increment(1)
        });
        await audit("topic_create", title);
        closeModal();
        toast("Konu açıldı");
        openTopic(topicRef.id);
    } catch (e) { alert(e.message); }
}

        const acts = document.getElementById("topicActions");
        let ah = "";
        if (isSupervisor() || t.authorId === currentUserId) {
            ah += `<button class="btn btn-ghost btn-sm" onclick="renameTopicModal('${topicId}')"><i class="fa-solid fa-pen"></i> Başlık</button>`;
            ah += `<button class="btn btn-ghost btn-sm" onclick="toggleLock('${topicId}')"><i class="fa-solid fa-lock"></i> ${t.locked ? "Aç" : "Kilitle"}</button>`;
        }
        if (isSupervisor()) {
            ah += `<button class="btn btn-ghost btn-sm" onclick="togglePin('${topicId}')"><i class="fa-solid fa-thumbtack"></i> ${t.pinned ? "Pin kaldır" : "Pin"}</button>`;
            ah += `<button class="btn btn-danger btn-sm" onclick="deleteTopic('${topicId}')"><i class="fa-solid fa-trash"></i></button>`;
        }
        acts.innerHTML = ah;
        const rb = document.getElementById("replyBox");
        if (rb) rb.style.display = t.locked ? "none" : "block";
    });

    unsub = db.collection("forumPosts").where("topicId", "==", topicId).onSnapshot(snap => {
        allPostsCache = [];
        snap.forEach(d => allPostsCache.push({ id: d.id, ...d.data() }));
        allPostsCache.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderPostsPage();
    });
}

function renderPostsPage() {
    const box = document.getElementById("postList");
    if (!box) return;
    const total = allPostsCache.length;
    const pages = Math.max(1, Math.ceil(total / POST_PAGE));
    if (postPage > pages) postPage = pages;
    const start = (postPage - 1) * POST_PAGE;
    const slice = allPostsCache.slice(start, start + POST_PAGE);
    box.innerHTML = slice.map((p, idx) => {
        const num = start + idx + 1;
        const isOwn = p.authorId === currentUserId;
        const canDel = isSupervisor() || isOwn;
        return `<div class="post-card" id="post_${p.id}">
            <div class="post-head">
                <span><strong style="color:var(--text)">${esc(p.authorName)}</strong>${p.isOp ? ' · <span style="color:var(--purple)">KONU</span>' : ""}${p.editedAt ? ' · <em>düzenlendi</em>' : ""}</span>
                <span>#${num} · ${formatDate(p.createdAt)}</span>
            </div>
            <div class="post-body" id="postBody_${p.id}">${bbcode(p.body)}</div>
            <div class="post-actions">
                <button class="btn btn-ghost btn-sm" onclick="quotePost('${p.id}')"><i class="fa-solid fa-quote-left"></i> Alıntı</button>
                ${isOwn ? `<button class="btn btn-ghost btn-sm" onclick="editPost('${p.id}')"><i class="fa-solid fa-pen"></i> Düzenle</button>` : ""}
                ${canDel && !p.isOp ? `<button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}')"><i class="fa-solid fa-trash"></i></button>` : ""}
            </div>
        </div>`;
    }).join("") || '<div class="empty">Mesaj yok</div>';

    const pag = document.getElementById("postPag");
    if (pag) {
        if (total <= POST_PAGE) { pag.innerHTML = ""; return; }
        let h = "";
        for (let i = 1; i <= pages; i++) {
            h += `<button class="${i === postPage ? "active" : ""}" onclick="postPage=${i};renderPostsPage()">${i}</button>`;
        }
        pag.innerHTML = h;
    }
}

function quotePost(postId) {
    const p = allPostsCache.find(x => x.id === postId);
    if (!p) return;
    const ta = document.getElementById("replyBody");
    if (!ta) return;
    const name = (p.authorName || "").split(" (")[0];
    ta.value = `[quote=${name}]${p.body}[/quote]\n\n` + ta.value;
    ta.focus();
}

async function submitReply() {
    if (view.topic?.locked) return alert("Konu kilitli.");
    const body = document.getElementById("replyBody").value.trim();
    if (!body) return alert("Boş mesaj.");
    const topicId = view.topicId;
    const now = firebase.firestore.FieldValue.serverTimestamp();
    try {
        await db.collection("forumPosts").add({
            topicId, authorId: currentUserId,
            authorName: currentUser.name + " (" + currentUser.rank + ")",
            body, createdAt: now, isOp: false
        });
        await db.collection("forumTopics").doc(topicId).update({
            lastPostAt: now, replyCount: firebase.firestore.FieldValue.increment(1)
        });
        // bildirim: konu sahibine
        const t = view.topic;
        if (t?.authorId) pushNotif(t.authorId, currentUser.name + " konuna yanıt yazdı: " + (t.title || ""), topicId);
        document.getElementById("replyBody").value = "";
        toast("Yanıt eklendi");
    } catch (e) { alert(e.message); }
}

async function toggleLock(id) {
    const locked = !view.topic?.locked;
    await db.collection("forumTopics").doc(id).update({ locked });
    await audit(locked ? "lock" : "unlock", view.topic?.title);
    toast(locked ? "Kilitlendi" : "Kilit açıldı");
}
async function togglePin(id) {
    const pinned = !view.topic?.pinned;
    await db.collection("forumTopics").doc(id).update({ pinned });
    await audit(pinned ? "pin" : "unpin", view.topic?.title);
    toast(pinned ? "Pinlendi" : "Pin kalktı");
}
async function deleteTopic(id) {
    if (!confirm("Konu ve tüm yanıtlar silinsin mi?")) return;
    const posts = await db.collection("forumPosts").where("topicId", "==", id).get();
    const batch = db.batch();
    posts.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection("forumTopics").doc(id));
    await batch.commit();
    if (view.catId) {
        await db.collection("forumCategories").doc(view.catId).update({
            topicCount: firebase.firestore.FieldValue.increment(-1)
        });
    }
    await audit("topic_delete", view.topic?.title || id);
    toast("Silindi");
    openCategory(view.catId);
}
async function deletePost(id) {
    if (!confirm("Yanıt silinsin mi?")) return;
    await db.collection("forumPosts").doc(id).delete();
    await db.collection("forumTopics").doc(view.topicId).update({
        replyCount: firebase.firestore.FieldValue.increment(-1)
    });
    await audit("post_delete", id);
    toast("Yanıt silindi");
}

function editPost(postId) {
    const p = allPostsCache.find(x => x.id === postId);
    if (!p) return;
    if (p.authorId !== currentUserId && !isSupervisor()) return alert("Sadece kendi yazını düzenleyebilirsin.");
    document.getElementById("modalBox").innerHTML = `
        <h3>Mesajı Düzenle</h3>
        <div class="form-group">
            <div class="bb-toolbar" id="bbEdit"></div>
            <textarea id="editPostBody" class="form-control" rows="8">${esc(p.body).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/&quot;/g,'"')}</textarea>
            <div class="upload-zone" onclick="document.getElementById('editFile').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Foto ekle
                <input type="file" id="editFile" accept="image/*" onchange="uploadToField(this,'editPostBody')">
            </div>
            <div class="preview-box" id="editPostBody_prev">${bbcode(p.body)}</div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
            <button class="btn btn-success" onclick="saveEditPost('${postId}')">Kaydet</button>
        </div>`;
    document.getElementById("modalBg").classList.add("show");
    mountBb("bbEdit", "editPostBody");
    // textarea'ya ham metin
    document.getElementById("editPostBody").value = p.body;
    document.getElementById("editPostBody").oninput = function () {
        const prev = document.getElementById("editPostBody_prev");
        if (prev) prev.innerHTML = bbcode(this.value);
    };
}
async function saveEditPost(postId) {
    const body = document.getElementById("editPostBody").value.trim();
    if (!body) return alert("Boş olamaz.");
    try {
        await db.collection("forumPosts").doc(postId).update({
            body,
            editedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await audit("post_edit", postId);
        closeModal();
        toast("Güncellendi");
    } catch (e) { alert(e.message); }
}

/* —— MEMBERS —— */
function goMembers() {
    clearUnsub();
    document.getElementById("mainView").innerHTML = `
        <div class="breadcrumb"><a href="#" onclick="goHome();return false;">Forum</a> / Üyeler</div>
        <div class="page-head"><div><h2>Detective &amp; GND Üyeleri</h2></div></div>
        <div class="panel" id="memberList"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i></div></div>`;
    db.collection("users").where("status", "==", "approved").get().then(snap => {
        const box = document.getElementById("memberList");
        const members = [];
        snap.forEach(d => {
            const u = d.data();
            if (isAllowedRank(u.rank)) members.push(u);
        });
        members.sort((a, b) => (a.rank || "").localeCompare(b.rank || ""));
        box.innerHTML = members.map(u => `
            <div class="member-row">
                <div><strong>${esc(u.name)}</strong> <span style="color:var(--dim)">#${esc(u.badge || "")}</span></div>
                <span class="badge ${/gnd/i.test(u.rank) ? "gnd" : ""}">${esc(u.rank)}</span>
            </div>`).join("") || '<div class="empty">Üye yok</div>';
    });
}

/* —— ADMIN —— */
function goAdmin() {
    if (!isSupervisor()) return;
    clearUnsub();
    document.getElementById("mainView").innerHTML = `
        <div class="breadcrumb"><a href="#" onclick="goHome();return false;">Forum</a> / Yönetim</div>
        <div class="page-head"><div><h2>Yönetim</h2><p>Kategori & audit log</p></div></div>
        <div class="tabs">
            <button class="active" onclick="adminTab('cat',this)">Kategoriler</button>
            <button onclick="adminTab('log',this)">Audit Log</button>
        </div>
        <div id="adminBody"></div>`;
    adminTab("cat");
}
function adminTab(which, btn) {
    if (btn) {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
    }
    const body = document.getElementById("adminBody");
    if (which === "cat") {
        body.innerHTML = `
            <div class="panel" style="padding:16px;margin-bottom:14px;border:1px solid rgba(167,139,250,0.25);">
                <h3 style="font-size:1rem;margin-bottom:12px;"><i class="fa-solid fa-folder-plus" style="color:var(--purple);"></i> Yeni kategori</h3>
                <div class="form-group"><label>ID (slug, değişmez)</label><input id="newCatId" class="form-control" placeholder="ornek-kategori"></div>
                <div class="form-group"><label>Başlık</label><input id="newCatTitle" class="form-control" placeholder="Görünen ad"></div>
                <div class="form-group"><label>Açıklama</label><input id="newCatDesc" class="form-control" placeholder="Kısa açıklama"></div>
                <button class="btn btn-success btn-sm" onclick="addCategory()"><i class="fa-solid fa-plus"></i> Ekle</button>
            </div>
            <p style="font-size:0.8rem;color:var(--dim);margin-bottom:10px;">Mevcut kategoriler — başlık ve açıklamayı düzenleyebilirsin</p>
            <div id="adminCats"></div>`;
        db.collection("forumCategories").orderBy("order").get().then(snap => {
            const box = document.getElementById("adminCats");
            let html = "";
            snap.forEach(d => {
                const c = d.data();
                html += `<div class="panel" style="padding:14px;margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
                        <div>
                            <span class="badge" style="margin-right:6px;">${d.id}</span>
                            <strong>${esc(c.title)}</strong>
                            <div style="font-size:0.8rem;color:var(--dim);margin-top:4px;">${esc(c.desc || "")}</div>
                        </div>
                        <div style="display:flex;gap:6px;">
                            <button class="btn btn-ghost btn-sm" onclick="editCategoryModal('${d.id}')"><i class="fa-solid fa-pen"></i> Düzenle</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCategory('${d.id}')">Sil</button>
                        </div>
                    </div>
                </div>`;
            });
            box.innerHTML = html || '<div class="empty">Kategori yok</div>';
        });
    } else {
        body.innerHTML = '<div class="panel" id="auditList"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i></div></div>';
        db.collection("forumAudit").orderBy("createdAt", "desc").limit(50).get().then(snap => {
            const box = document.getElementById("auditList");
            if (snap.empty) { box.innerHTML = '<div class="empty">Log yok</div>'; return; }
            let html = "";
            snap.forEach(d => {
                const l = d.data();
                html += `<div class="log-row"><strong>${esc(l.action)}</strong> — ${esc(l.detail)} · ${esc(l.by)} · ${formatDate(l.createdAt)}</div>`;
            });
            box.innerHTML = html;
        }).catch(() => {
            db.collection("forumAudit").limit(50).get().then(snap => {
                const box = document.getElementById("auditList");
                const items = [];
                snap.forEach(d => items.push(d.data()));
                box.innerHTML = items.map(l =>
                    `<div class="log-row"><strong>${esc(l.action)}</strong> — ${esc(l.detail)} · ${esc(l.by)}</div>`
                ).join("") || '<div class="empty">Log yok</div>';
            });
        });
    }
}
async function addCategory() {
    const id = document.getElementById("newCatId").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
    const title = document.getElementById("newCatTitle").value.trim();
    const desc = document.getElementById("newCatDesc").value.trim();
    if (!id || !title) return alert("ID ve başlık zorunlu.");
    await db.collection("forumCategories").doc(id).set({
        title, desc, icon: "fa-folder", gndOnly: false, order: 99, topicCount: 0
    });
    await audit("category_add", title);
    toast("Kategori eklendi");
    adminTab("cat");
}
async function deleteCategory(id) {
    if (!confirm("Kategori silinsin mi? (konular kalır)")) return;
    await db.collection("forumCategories").doc(id).delete();
    await audit("category_delete", id);
    toast("Silindi");
    adminTab("cat");
}

function editCategoryModal(catId) {
    db.collection("forumCategories").doc(catId).get().then(s => {
        if (!s.exists) return;
        const c = s.data();
        document.getElementById("modalBox").innerHTML = `
            <h3>Kategori düzenle</h3>
            <p style="font-size:0.8rem;color:var(--dim);margin-bottom:12px;">ID: <code>${esc(catId)}</code> (değişmez)</p>
            <div class="form-group"><label>Başlık</label>
                <input type="text" id="editCatTitle" class="form-control" value=""></div>
            <div class="form-group"><label>Açıklama</label>
                <textarea id="editCatDesc" class="form-control" rows="3"></textarea></div>
            <div class="form-group"><label>İkon (Font Awesome class)</label>
                <input type="text" id="editCatIcon" class="form-control" placeholder="fa-folder"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
                <button class="btn btn-success" onclick="saveCategoryEdit('${catId}')">Kaydet</button>
            </div>`;
        document.getElementById("modalBg").classList.add("show");
        document.getElementById("editCatTitle").value = c.title || "";
        document.getElementById("editCatDesc").value = c.desc || "";
        document.getElementById("editCatIcon").value = c.icon || "fa-folder";
    });
}
async function saveCategoryEdit(catId) {
    const title = document.getElementById("editCatTitle").value.trim();
    const desc = document.getElementById("editCatDesc").value.trim();
    const icon = document.getElementById("editCatIcon").value.trim() || "fa-folder";
    if (!title) return alert("Başlık zorunlu.");
    await db.collection("forumCategories").doc(catId).update({ title, desc, icon });
    await audit("category_edit", title);
    closeModal();
    toast("Kategori güncellendi");
    if (view.page === "category" && view.catId === catId) openCategory(catId);
    else if (view.page === "home") goHome();
    else adminTab("cat");
}

function renameTopicModal(topicId) {
    const t = view.topic || {};
    document.getElementById("modalBox").innerHTML = `
        <h3>Konu başlığını düzenle</h3>
        <div class="form-group"><label>Yeni başlık</label>
            <input type="text" id="editTopicTitle" class="form-control"></div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
            <button class="btn btn-success" onclick="saveTopicTitle('${topicId}')">Kaydet</button>
        </div>`;
    document.getElementById("modalBg").classList.add("show");
    document.getElementById("editTopicTitle").value = t.title || "";
}
async function saveTopicTitle(topicId) {
    const title = document.getElementById("editTopicTitle").value.trim();
    if (!title) return alert("Başlık boş olamaz.");
    await db.collection("forumTopics").doc(topicId).update({ title });
    await audit("topic_rename", title);
    closeModal();
    toast("Başlık güncellendi");
}
</script>
</body>
</html>
